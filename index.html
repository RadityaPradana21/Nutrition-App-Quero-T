    <style>
        body {

        /* 3. All label/caption text: font-weight 500, color #4c4639 */

        /* 4. All heading text: font-weight 700, color #241a03 */

        /* Prevent opacity < 0.8 */

        /* Ensure minimum font-size is 13px */

    <!-- React 18, React Router DOM, Babel standalone -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-stone-900 selection:bg-[#fff2dc]">

    <!-- Main Desktop Frame Mockup simulating premium health app on desktop -> Responsive on Mobile -->
    <div id="root" class="relative w-full max-w-md h-[900px] md:h-[860px] bg-[#FEFAF2] md:rounded-[40px] md:shadow-2xl overflow-hidden border-0 md:border-8 md:border-stone-800 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext } = React;
        const { HashRouter, Routes, Route, useNavigate, useLocation, Link } = ReactRouterDOM;

        // --- CONTEXT & GENERAL STATE MANAGEMENT ---
        const AppContext = createContext();

        function AppProvider({ children }) {
            // Profil pengguna state
            const [userProfile, setUserProfile] = useState({
                name: "Raditya",
                age: 22,
                gender: "Laki-laki",
                height: 170, // cm
                weight: 65,  // kg
                activityLevel: "moderate", // Options: sedentary, light, moderate, active
                healthGoal: "stay_healthy",  // Options: stay_healthy, lose_weight, gain_muscle, detox
                restrictions: ["Gluten-Free", "Low Sugar"],
                dailyCalories: 2100,
                protein: 85,
                fiber: 25,
                waterTarget: 2.5, // L
                streak: 5
            });

            // Target keranjang belanjaan virtual
            const [cartCount, setCartCount] = useState(0);

            // Admin AI rule settings state map
            const [aiConfig, setAiConfig] = useState({
                useMifflin: true,
                activityMultiplierBase: 1.25,
                ageAdjustmentFactor: 5,
                predictionAccuracy: 82,
                recommendationRate: 76,
                // Rule mappings
                bmiUnderweightMapping: "Protein+",
                bmiNormalMapping: "Active",
                bmiOverweightMapping: "Lean-Core",
                goals: ["Weight Loss", "Muscle Gain", "Diabetes Care"]
            });

            // Custom Toast Alert state
            const [toast, setToast] = useState({ show: false, message: "" });

            const triggerToast = (message) => {
                setToast({ show: true, message });
                setTimeout(() => {
                    setToast({ show: false, message: "" });
                }, 3000);
            };

            // Mifflin-St Jeor formula dynamic engine integration
            const calculateDailyKcal = () => {
                const { age, height, weight, gender, healthGoal, activityLevel } = userProfile;
                if (!age || !height || !weight) return;

                let bmr = 0;
                // Simplified Mifflin-St Jeor Formula
                if (gender === "Laki-laki") {
                    bmr = (10 * Number(weight)) + (6.25 * Number(height)) - (5 * Number(age)) + 5;
                } else {
                    bmr = (10 * Number(weight)) + (6.25 * Number(height)) - (5 * Number(age)) - 161;
                }

                // Apply AI Config base multiplier multiplier
                const activityMultiplier = {
                    sedentary: Number(aiConfig.activityMultiplierBase),
                    light: Number(aiConfig.activityMultiplierBase) + 0.15,
                    moderate: Number(aiConfig.activityMultiplierBase) + 0.3,
                    active: Number(aiConfig.activityMultiplierBase) + 0.5
                }[activityLevel] || 1.25;

                let tdee = Math.round(bmr * activityMultiplier);

                // Goal offset calculator
                if (healthGoal === "lose_weight") {
                    tdee -= 350;
                } else if (healthGoal === "gain_muscle") {
                    tdee += 300;
                } else if (healthGoal === "detox") {
                    tdee -= 150;
                }

                // Adjust using Admin Factor Adjustment
                const configAdjust = (100 - Number(aiConfig.ageAdjustmentFactor)) / 100;
                tdee = Math.round(tdee * configAdjust);

                if (tdee < 1200) tdee = 1200; // Protection floor

                const computedProtein = Math.round(Number(weight) * 1.3);
                const computedFiber = Math.round(tdee / 84);

                setUserProfile(prev => ({
                    ...prev,
                    dailyCalories: tdee,
                    protein: computedProtein,
                    fiber: computedFiber
                }));
            };

            // recalculate triggers
            useEffect(() => {
                calculateDailyKcal();
            }, [userProfile.weight, userProfile.height, userProfile.age, userProfile.activityLevel, userProfile.healthGoal, aiConfig.useMifflin, aiConfig.activityMultiplierBase, aiConfig.ageAdjustmentFactor]);

            return (
                <AppContext.Provider value={{ 
                    userProfile, setUserProfile, 
                    aiConfig, setAiConfig, 
                    cartCount, setCartCount,
                    toast, triggerToast 
                }}>
                    {children}
                </AppContext.Provider>
            );
        }

        // --- SUBCOMPONENT: GLOBAL REUSABLE HEADER ---
        function SharedHeader({ title, showBack = false }) {
            const navigate = useNavigate();
            return (
                <header className="sticky top-0 z-40 bg-white/95 border-b border-[#F4E1B9]/30 backdrop-blur-sm px-5 h-16 flex justify-between items-center w-full shrink-0">
                    <div className="flex items-center gap-3">
                        {showBack ? (
                            <button 
                                onClick={() => navigate(-1)} 
                                className="p-2 rounded-full hover:bg-[#fff2dc] text-[#705c1b] flex items-center justify-center transition-all active:scale-95 border border-[#F4E1B9]/50"
                                style={{ width: "36px", height: "36px" }}
                            >
                                <span className="material-symbols-outlined text-[20px]">arrow_back</span>
                            </button>
                        ) : (
                            <div className="w-9 h-9 bg-brand-primary/10 rounded-full flex items-center justify-center text-brand-primary">
                                <span className="material-symbols-outlined text-[20px]">psychology</span>
                            </div>
                        )}
                        <h1 className="text-[17px] font-extrabold text-[#241a03] tracking-tight font-sans">
                            {title}
                        </h1>
                    </div>
                    <div className="flex items-center gap-2">
                        <Link to="/notifications" className="w-8 h-8 flex items-center justify-center hover:bg-[#ffecc6] rounded-full text-[#705c1b]">
                            <span className="material-symbols-outlined text-[20px]">notifications</span>
                        </Link>
                        <Link to="/profile" className="w-8 h-8 rounded-full overflow-hidden border border-[#705c1b]/20 bg-brand-primary-container flex items-center justify-center font-bold text-xs text-brand-primary">
                            R-T
                        </Link>
                    </div>
                </header>
            );
        }

        // --- SUBCOMPONENT: BOTTOM NAVIGATION BAR ---
        function BottomNavigation() {
            const navigate = useNavigate();
            const location = useLocation();
            
            // Only show on: /home, /recommendations, /insights, /notifications, /profile
            const showOnPaths = ["/home", "/recommendations", "/insights", "/notifications", "/profile"];
            const shouldShow = showOnPaths.includes(location.pathname);

            if (!shouldShow) return null;

            const tabs = [
                { path: "/home", icon: "home", label: "Home" },
                { path: "/insights", icon: "insights", label: "Nutrisi" },
                { path: "/notifications", icon: "notifications", label: "Notifikasi" },
                { path: "/profile", icon: "person", label: "Profil" }
            ];

            const isActive = (path) => {
                // If path is insights, it should also be active on recommendations route
                if (path === "/insights" && (location.pathname === "/insights" || location.pathname === "/recommendations")) {
                    return true;
                }
                return location.pathname === path;
            };

            return (
                <nav className="absolute bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 h-16 bg-white/95 backdrop-blur-sm border-t border-[#F4E1B9]/50 rounded-t-2xl shadow-[0_-4px_20px_rgba(107,91,46,0.06)] shrink-0">
                    {tabs.map((tab) => (
                        <button
                            key={tab.path}
                            onClick={() => navigate(tab.path)}
                            className={`flex flex-col items-center justify-center w-14 h-full relative font-medium transition-all ${
                                isActive(tab.path) ? 'scale-105' : 'hover:scale-[1.02]'
                            }`}
                        >
                            <span 
                                className="material-symbols-outlined text-[22px]"
                                style={{ 
                                    color: isActive(tab.path) ? "#576415" : "#7d7667",
                                    fontVariationSettings: isActive(tab.path) ? "'FILL' 1" : "'FILL' 0"
                                }}
                            >
                                {tab.icon}
                            </span>
                            <span 
                                className="text-[10px] tracking-tight mt-0.5"
                                style={{ color: isActive(tab.path) ? "#576415" : "#7d7667" }}
                            >
                                {tab.label}
                            </span>
                        </button>
                    ))}
                </nav>
            );
        }

        // --- SUBCOMPONENT: ACCORDION ITEM ---
        function AccordionItem({ icon, title, subtitle, isOpen, onToggle, children }) {
            return (
                <div className="organic-card overflow-hidden">
                    <button 
                        onClick={onToggle}
                        className="w-full p-5 flex justify-between items-center hover:bg-[#fff8f1]/50 text-left transition-colors"
                    >
                        <div className="flex items-center gap-3.5">
                            <div className="w-10 h-10 rounded-full bg-brand-primary/10 flex items-center justify-center text-brand-primary">
                                <span className="material-symbols-outlined text-[22px]">{icon}</span>
                            </div>
                            <div>
                                <h4 className="text-[14px] font-bold text-brand-charcoal">{title}</h4>
                                <p className="text-[11px] text-[#7d7667]">{subtitle}</p>
                            </div>
                        </div>
                        <span className={`material-symbols-outlined text-gray-400 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`}>
                            expand_more
                        </span>
                    </button>
                    
                    <div 
                        className={`transition-all duration-300 ease-in-out overflow-hidden ${
                            isOpen ? 'max-h-[500px] border-t border-gray-100 p-5 bg-[#FFFBF7]' : 'max-h-0'
                        }`}
                    >
                        {children}
                    </div>
                </div>
            );
        }

        // --- PROTOTYPE SCREENS: SPLASH, LOGIN, AND ONBOARDING STEPS 1-4 ---
        function SplashScreen() {
            const navigate = useNavigate();
            return (
                <div className="flex flex-col justify-between items-center p-6 h-full bg-[#FEFAF2] text-center">
                    <div className="my-auto space-y-4">
                        <div className="w-24 h-24 bg-[#576415]/10 rounded-full flex items-center justify-center text-[#576415] mx-auto shadow-md">
                            <span className="material-symbols-outlined text-[64px]">psychology</span>
                        </div>
                        <h1 className="text-3xl font-black text-[#241a03] font-sans">Quero-T AI</h1>
                        <p className="text-sm text-[#4c4639] max-w-xs leading-relaxed">

                        </p>
                    </div>
                    <div className="w-full pb-10">
                        <button

                            className="w-full h-14 bg-[#576415] text-white rounded-3xl font-bold flex justify-center items-center gap-2 hover:bg-[#3f4b00] active:scale-95 transition-transform shadow-lg"

                            <span>Mulai Sekarang</span>
                            <span className="material-symbols-outlined text-sm">arrow_forward</span>
                        </button>

        }

        function LoginScreen() {

                    <div>
                        <div className="flex items-center gap-2 mb-8">

                        </div>

                        <div className="space-y-6">
                            <div className="space-y-1.5">
                                <h2 className="text-2xl font-black text-[#241a03] leading-tight">Selamat Datang Kembali 👋</h2>
                                <p className="text-sm text-gray-500">Silakan masuk untuk melanjutkan profil kesehatan gizi Anda.</p>
                            </div>

                            <div className="space-y-4 pt-4">
                                <div className="space-y-1.5">
                                    <label className="text-xs font-bold text-[#705c1b] uppercase">Email</label>
                                    <input 
                                        type="email"

                                    />

                    </div>

                    <div className="pb-8">
                        <button

                        >
                            <span>Masuk</span>
                            <span className="material-symbols-outlined text-sm">login</span>
                        </button>
                    </div>
                </div>
            );
        }

        function OnboardingStep1() {
            const { userProfile, setUserProfile } = useContext(AppContext);
            const navigate = useNavigate();

            return (
                <div className="flex flex-col h-full bg-[#FFF8F1] p-6 justify-between">
                    <div>
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-[#705c1b] font-extrabold text-sm tracking-widest uppercase">Langkah 1 dari 5</span>
                            <div className="w-20 h-2 bg-[#d7bd72]/30 rounded-full overflow-hidden">
                                <div className="w-1/5 h-full bg-[#576415] rounded-full"></div>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 mb-6">
                            <button 
                                onClick={() => navigate('/login')} 
                                className="p-2 rounded-full hover:bg-amber-50 text-[#705c1b] flex items-center justify-center transition-all active:scale-95"
                                style={{ width: "40px", height: "40px" }}
                            >
                                <span className="material-symbols-outlined text-[24px]">arrow_back</span>
                            </button>
                            <h2 className="text-2xl font-black text-[#241a03] leading-tight">Siapa nama Anda? ✨</h2>
                        </div>

                        <div className="space-y-4 pt-4">
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-[#705c1b] uppercase">Nama Lengkap</label>
                                <input 
                                    type="text" 
                                    value={userProfile.name}
                                    onChange={(e) => setUserProfile(prev => ({ ...prev, name: e.target.value }))}
                                    className="w-full bg-white border border-[#F4E1B9]/60 rounded-xl px-4 py-3 text-sm text-brand-charcoal outline-none focus:ring-1 focus:ring-[#576415]"
                                    placeholder="Ketik nama Anda di sini..."
                                />
                            </div>
                        </div>
                    </div>

                    <div className="pb-8">
                        <button
                            onClick={() => navigate('/onboarding/2')}
                            disabled={!userProfile.name}
                            className={`w-full h-14 rounded-3xl font-bold flex justify-center items-center gap-2 transition-transform shadow-lg ${
                                userProfile.name ? 'bg-[#576415] text-white hover:bg-[#3f4b00] active:scale-95' : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                            }`}
                        >
                            <span>Lanjutkan</span>
                            <span className="material-symbols-outlined text-sm">arrow_forward</span>
                        </button>
                    </div>
                </div>
            );
        }

        function OnboardingStep2() {
            const { userProfile, setUserProfile } = useContext(AppContext);
            const navigate = useNavigate();

            return (
                <div className="flex flex-col h-full bg-[#FFF8F1] p-6 justify-between">
                    <div>
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-[#705c1b] font-extrabold text-sm tracking-widest uppercase">Langkah 2 dari 5</span>
                            <div className="w-20 h-2 bg-[#d7bd72]/30 rounded-full overflow-hidden">
                                <div className="w-2/5 h-full bg-[#576415] rounded-full"></div>
                            </div>
                        </div>

                        <div className="flex items-center gap-2 mb-6">
                            <button 
                                onClick={() => navigate('/onboarding/1')} 
                                className="p-2 rounded-full hover:bg-amber-50 text-[#705c1b] flex items-center justify-center transition-all active:scale-95"
                                style={{ width: "40px", height: "40px" }}
                            >
                                <span className="material-symbols-outlined text-[24px]">arrow_back</span>
                            </button>
                            <h2 className="text-2xl font-black text-[#241a03] leading-tight">Profil Anda 👤</h2>
                        </div>

                        <div className="space-y-6 pt-4">
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-[#705c1b] uppercase">Gender</label>
                                <div className="grid grid-cols-2 gap-4">
                                    {["Laki-laki", "Perempuan"].map(gender => (
                                        <button
                                            key={gender}
                                            onClick={() => setUserProfile(prev => ({ ...prev, gender }))}
                                            className={`p-4 rounded-2xl border-2 font-bold transition-all ${
                                                userProfile.gender === gender 
                                                    ? 'bg-[#E2F0D9] border-[#576415] text-[#576415]' 
                                                    : 'bg-white border-[#F4E1B9]/40 text-brand-charcoal'
                                            }`}
                                        >
                                            {gender}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-[#705c1b] uppercase">Usia (tahun)</label>
                                <input 
                                    type="number" 
                                    value={userProfile.age}
                                    onChange={(e) => setUserProfile(prev => ({ ...prev, age: Number(e.target.value) }))}
                                    className="w-full bg-white border border-[#F4E1B9]/60 rounded-xl px-4 py-3 text-sm text-brand-charcoal outline-none focus:ring-1 focus:ring-[#576415]"
                                />
                            </div>
                        </div>
                    </div>

                    <div className="pb-8">
                        <button
                            onClick={() => navigate('/onboarding/3')}

                            <div className="flex w-full mt-5 pt-5 border-t border-white/20 items-center justify-between text-center text-xs">
                                <div className="flex-1">
                                    <p className="font-black text-lg">12</p>
                                    <p className="text-[9px] opacity-75 uppercase tracking-widest">Pesanan</p>
                                </div>
                                <div className="w-[1px] h-6 bg-white/20"></div>
                                <div className="flex-1">
                                    <p className="font-black text-lg">{userProfile.dailyCalories}</p>
                                    <p className="text-[9px] opacity-75 uppercase tracking-widest">Target kcal</p>
                                </div>
                                <div className="w-[1px] h-6 bg-white/20"></div>
                                <div className="flex-1">
                                    <p className="font-black text-lg">{userProfile.streak} Hari 🔥</p>
                                    <p className="text-[9px] opacity-75 uppercase tracking-widest">Streak</p>
                                </div>
                            </div>
                        </div>

                        {/* Interactive edit body metrics section form */}
                        <div className="organic-card p-5 space-y-4">
                            <div className="flex justify-between items-center">
                                <h3 className="text-sm font-black text-brand-charcoal">Data Tubuh & Metrik</h3>
                                <button 
                                    onClick={() => setEditBody(!editBody)}
                                    className="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 text-brand-gold bg-[#FFF2DC] transition-colors"
                                >
                                    <span className="material-symbols-outlined text-base">{editBody ? "close" : "edit"}</span>
                                </button>
                            </div>

                            {editBody ? (
                                <div className="space-y-4 animate-fadeIn">
                                    {/* Editable metric inputs */}
                                    <div className="grid grid-cols-2 gap-3 text-xs">
                                        <div className="space-y-1">
                                            <label className="font-extrabold text-[#705c1b]">Umur (tahun)</label>
                                            <input 
                                                type="number" 
                                                value={userProfile.age} 
                                                onChange={(e) => setUserProfile(prev => ({ ...prev, age: Number(e.target.value) }))}
                                                className="w-full bg-[#FEFAF2] border rounded-xl p-2.5"
                                            />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="font-extrabold text-[#705c1b]">Tinggi (cm)</label>
                                            <input 
                                                type="number" 
                                                value={userProfile.height}
                                                onChange={(e) => setUserProfile(prev => ({ ...prev, height: Number(e.target.value) }))}
                                                className="w-full bg-[#FEFAF2] border rounded-xl p-2.5"
                                            />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="font-extrabold text-[#705c1b]">Berat (kg)</label>
                                            <input 
                                                type="number" 
                                                value={userProfile.weight}
                                                onChange={(e) => setUserProfile(prev => ({ ...prev, weight: Number(e.target.value) }))}
                                                className="w-full bg-[#FEFAF2] border rounded-xl p-2.5"
                                            />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="font-extrabold text-[#705c1b]">Tingkat Aktivitas</label>
                                            <select 
                                                value={userProfile.activityLevel} 
                                                onChange={(e) => setUserProfile(prev => ({ ...prev, activityLevel: e.target.value }))}
                                                className="w-full bg-[#FEFAF2] border rounded-xl text-xs p-2"
                                            >
                                                <option value="sedentary">Sedentary (Malas)</option>
                                                <option value="light">Ringan (Olah 1x)</option>
                                                <option value="moderate font-bold">Sedang (Moderate 3x)</option>
                                                <option value="active font-bold text-brand-primary">Aktif (Keras 6x)</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={handleMetricSave}
                                        className="w-full bg-brand-primary text-white text-xs font-bold py-3 rounded-xl transition-all active:scale-95"
                                    >
                                        Simpan & Update AI
                                    </button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="p-3 bg-[#fff2dc] rounded-xl">
                                        <p className="text-[10px] text-gray-400">Usia</p>
                                        <p className="font-bold text-brand-charcoal">{userProfile.age} tahun</p>
                                    </div>
                                    <div className="p-3 bg-[#fff2dc] rounded-xl">
                                        <p className="text-[10px] text-gray-400">Tinggi / Berat</p>
                                        <p className="font-bold text-brand-charcoal">{userProfile.height}cm / {userProfile.weight}kg</p>
                                    </div>
                                    <div className="p-3 bg-[#fff2dc] rounded-xl col-span-2">
                                        <p className="text-[10px] text-gray-400">Indeks Aktivitas Kalori</p>
                                        <p className="font-bold text-[#576415] capitalize">{userProfile.activityLevel} Activity Multiplier</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Collapsible Order History */}
                        <div className="organic-card overflow-hidden">
                            <button 
                                onClick={() => setOrdersOpen(!ordersOpen)}
                                className="w-full p-4 flex justify-between items-center text-left"
                            >
                                <span className="text-xs font-black text-brand-charcoal">📦 Riwayat Pesanan Paket</span>
                                <span className="material-symbols-outlined text-gray-400">{ordersOpen ? "expand_less" : "expand_more"}</span>
                            </button>
                            {ordersOpen && (
                                <div className="p-4 pt-0 border-t space-y-2 text-xs class-orders animate-fadeIn">
                                    <div className="p-2.5 bg-gray-50 rounded-lg flex justify-between items-center">
                                        <div>
                                            <p className="font-bold">#ORD-5731 (Weekly Healthy Pack)</p>
                                            <p className="text-[10px] text-gray-400">Mei 26, 2026</p>
                                        </div>
                                        <span className="bg-[#E2F0D9] text-[#576415] font-bold text-[9px] px-2 py-0.5 rounded">Rutin Terkirim</span>
                                    </div>
                                    <div className="p-2.5 bg-gray-50 rounded-lg flex justify-between items-center">
                                        <div>
                                            <p className="font-bold">#ORD-4122 (Booster Sourdough)</p>
                                            <p className="text-[10px] text-gray-400">Mei 12, 2026</p>
                                        </div>
                                        <span className="bg-gray-200 text-gray-600 font-bold text-[9px] px-2 py-0.5 rounded">Selesai</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Collapsible FAQ Help */}
                        <div className="organic-card overflow-hidden">
                            <button 
                                onClick={() => setFaqsOpen(prev => !prev)}
                                className="w-full p-4 flex justify-between items-center text-left"
                            >
                                <span className="text-xs font-black text-brand-charcoal">💡 Bantuan & FAQ Cepat</span>
                                <span className="material-symbols-outlined text-gray-400">{faqsOpen ? "expand_less" : "expand_more"}</span>
                            </button>
                            {faqsOpen && (
                                <div className="p-4 pt-0 border-t space-y-3.5 text-[11px] animate-fadeIn">
                                    <div className="space-y-1">
                                        <p className="font-bold text-brand-primary">Bagaimana Quero-T AI menebak makanan harian?</p>
                                        <p className="text-gray-400">Kami mengintegrasikan algoritma biologis Mifflin & target massa BMI untuk memprediksi kecukupan kalori ideal tanpa penumpukan lemak berlebih.</p>
                                    </div>
                                    <div className="space-y-1">
                                        <p className="font-bold text-brand-primary">Dapatkah saya merubah alergen kapan saja?</p>
                                        <p className="text-gray-400">Dapat! Buka menu Edit batasan dalam onboarding gate atau admin rule.</p>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Logout Reset Button */}
                        <button 
                            onClick={() => {
                                setUserProfile(prev => ({
                                    ...prev,
                                    name: "Raditya",
                                    age: 22,
                                    weight: 65,
                                    height: 170
                                }));
                                triggerToast("Sesi berhasil direset. Kembali ke Onboarding.");
                                navigate('/');
                            }}
                            className="w-full py-4 border-2 border-red-500/20 hover:bg-red-500/5 text-red-500 font-extrabold text-xs rounded-2xl active:scale-95 transition-all text-center"
                        >
                            Keluar dari Akun (Reset state)
                        </button>
                    </div>

                    <BottomNavigation />
                </div>
            );
        }

        // --- PAGE 9: AI NOTIFICATIONS TIMELINE HUB ---
        function NotificationsScreen() {
            const { triggerToast, userProfile, setUserProfile } = useContext(AppContext);
            const [notifications, setNotifications] = useState([
                { id: 1, type: "HEALTH", time: "Baru Saja", title: "Health Alert", text: "Asupan serat harian di bawah target minimum. AI merekomendasikan booster chia seeds pagi ini!", isRead: false },
                { id: 2, type: "ACHIEVEMENT", time: "2 Jam Lalu", title: "Achievement", text: "Kamu berhasil mencetak rekor 7 hari konsumsi tertib! Tingkat stamina meningkat 15%.", isRead: false },
                { id: 3, type: "LOGISTICS", time: "Logistik", title: "Restock Alert", text: "Slot stok Quero-T Active di kulkas tinggal 3 buah. Pesan paket langganan sekarang!", isRead: false }
            ]);

            const markAsRead = (id) => {
                setNotifications(prev => prev.map(n => n.id === id ? { ...n, isRead: true } : n));
                triggerToast("Notifikasi ditandai dibaca.");
            };

            const triggerAction = (type) => {
                if (type === "HEALTH") {
                    setUserProfile(prev => ({ ...prev, streak: prev.streak + 2 }));
                    triggerToast("Booster Serat Ditambahkan! Streak diperpanjang! ✨🚀");
                } else if (type === "ACHIEVEMENT") {
                    triggerToast("Klaim Hadiah 1 Voucher Diskon Roti Berhasil! 🎁");
                } else {
                    triggerToast("Redireksi langsung ke pembayaran aman.");
                }
            };

            return (
                <div className="flex flex-col bg-[#FFF8F1] h-full overflow-y-auto no-scrollbar pb-20">
                    <SharedHeader title="🔔 Pusat Notifikasi AI" showBack={true} />

                    <div className="p-5 space-y-6">
                        <div className="space-y-1">
                            <h2 className="text-base font-black text-brand-charcoal font-sans">Timeline Wawasan Gizi</h2>
                            <p className="text-[11px] text-brand-tertiary">Sumbangan kecerdasan AI harian demi mengawal gaya hidup sehat Anda.</p>
                        </div>

                        {/* Timeline stack */}
                        <div className="relative pl-4 space-y-8">
                            <div className="absolute left-1.5 top-2 bottom-2 w-0.5 bg-gradient-to-b from-brand-primary/40 to-transparent"></div>

                            {notifications.length > 0 ? (
                                notifications.map(notif => (
                                    <div key={notif.id} className="relative space-y-2">
                                        {/* Dot timeline */}
                                        <span className={`absolute -left-6 top-1 h-3.5 w-3.5 rounded-full border-2 border-white shadow-sm ring-4 ring-[#FFF8F1] ${
                                            notif.isRead ? 'bg-gray-400' : 'bg-brand-primary'
                                        }`}></span>
                                        
                                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-brand-primary/10 space-y-3">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] text-gray-400 font-bold uppercase block">{notif.time}</span>
                                                <span className={`text-[9px] font-black px-2 py-0.5 rounded-full ${
                                                    notif.type === 'HEALTH' ? 'bg-amber-100 text-[#ba1a1a]' : 'bg-brand-primary/10 text-brand-primary'
                                                }`}>
                                                    {notif.type}
                                                </span>
                                            </div>

                                            <div className="space-y-1">
                                                <h4 className="text-xs font-bold text-brand-charcoal">{notif.title}</h4>
                                                <p className="text-[11px] text-[#4c4639] leading-relaxed font-vietnam">{notif.text}</p>
                                            </div>

                                            <div className="flex gap-2 pt-1">
                                                <button 
                                                    onClick={() => triggerAction(notif.type)}
                                                    className="bg-brand-primary/10 hover:bg-brand-primary/15 text-brand-primary font-bold text-[10px] px-3 py-1.5 rounded-lg active:scale-95 transition-all"
                                                >
                                                    {notif.type === 'HEALTH' ? 'Konsumsi Solusi' : notif.type === 'ACHIEVEMENT' ? 'Klaim Hadiah 🎁' : 'Beli Sekarang'}
                                                </button>
                                                {!notif.isRead && (
                                                    <button 
                                                        onClick={() => markAsRead(notif.id)}
                                                        className="text-gray-400 font-medium text-[10px] px-2 py-1 hover:text-gray-600"
                                                    >
                                                        Tandai dibaca
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <p className="text-xs text-center text-gray-400 pt-10">Pusat log peringatan kosong.</p>
                            )}
                        </div>
                    </div>

                    <BottomNavigation />
                </div>
            );
        }

        // --- MASTER APPLICATION WRAPPER & ROUTER CONFIG ---
        function App() {
            const { toast } = useContext(AppContext);
            return (
                <div className="w-full h-full relative">
                    <Routes>
                        <Route path="/" element={<SplashScreen />} />
                        <Route path="/splash" element={<SplashScreen />} />
                        <Route path="/login" element={<LoginScreen />} />
                        <Route path="/onboarding/1" element={<OnboardingStep1 />} />
                        <Route path="/onboarding/2" element={<OnboardingStep2 />} />
                        <Route path="/onboarding/3" element={<OnboardingStep3 />} />
                        <Route path="/onboarding/4" element={<OnboardingStep4 />} />
                        <Route path="/onboarding/5" element={<RestrictionsScreen />} />
                        <Route path="/onboarding/restrictions" element={<RestrictionsScreen />} />
                        <Route path="/ai-processing" element={<AiProcessingScreen />} />
                        <Route path="/onboarding-result" element={<OnboardingResultScreen />} />
                        
                        {/* Tab main features */}
                        <Route path="/home" element={<HomeScreen />} />
                        <Route path="/recommendations" element={<RecommendationsScreen />} />
                        <Route path="/insights" element={<InsightsScreen />} />
                        <Route path="/subscription" element={<SubscriptionScreen />} />
                        <Route path="/admin" element={<AdminConfigScreen />} />
                        <Route path="/profile" element={<ProfileScreen />} />
                        <Route path="/notifications" element={<NotificationsScreen />} />
                    </Routes>

                    {/* Smooth dynamic Custom Overlay Toast alert */}
                    {toast.show && (
                        <div className="absolute top-20 left-6 right-6 z-50 bg-[#241a03] text-white text-[12px] p-3.5 rounded-2xl flex items-center gap-3.5 shadow-xl border border-brand-primary/20 opacity-95 transition-all transform animate-fadeIn font-semibold">
                            <span className="material-symbols-outlined text-[20px] text-[#F3A72A]">info</span>
                            <span className="flex-1 font-vietnam tracking-wide">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        // APP BO0TSTRAPPER
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(
            <AppProvider>
                <HashRouter>
                    <App />
                </HashRouter>
            </AppProvider>
        );
    </script>
</body>
</html>
