<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-stone-900 selection:bg-[#fff2dc]">

    <div id="root" class="relative w-full max-w-md h-[900px] md:h-[860px] bg-[#FEFAF2] md:rounded-[40px] md:shadow-2xl overflow-hidden border-0 md:border-8 md:border-stone-800 flex flex-col"></div>

    <!-- ✅ FIX: type="text/babel" bukan type="module", dan pakai ReactRouterDOM bukan import -->
    <script type="text/babel">
        const { useState, useEffect, useContext, createContext } = React;
        // ✅ FIX: ReactRouterDOM dari CDN sudah tersedia global via react-router-dom@5
        const { HashRouter, Switch, Route, useHistory, useLocation, Link } = ReactRouterDOM;

        const AppContext = createContext();

        function AppProvider({ children }) {
            const [userProfile, setUserProfile] = useState({
                name: "Raditya",
                age: 22,
                gender: "Laki-laki",
                height: 170,
                weight: 65,
                activityLevel: "moderate",
                healthGoal: "stay_healthy",
                restrictions: ["Gluten-Free", "Low Sugar"],
                dailyCalories: 2100,
                protein: 85,
                fiber: 25,
                waterTarget: 2.5,
                streak: 5
            });

            const [cartCount, setCartCount] = useState(0);
            const [aiConfig, setAiConfig] = useState({
                useMifflin: true,
                activityMultiplierBase: 1.25,
                ageAdjustmentFactor: 5,
                predictionAccuracy: 82,
                recommendationRate: 76,
                bmiUnderweightMapping: "Protein+",
                bmiNormalMapping: "Active",
                bmiOverweightMapping: "Lean-Core",
                goals: ["Weight Loss", "Muscle Gain", "Diabetes Care"]
            });
            const [toast, setToast] = useState({ show: false, message: "" });

            const triggerToast = (message) => {
                setToast({ show: true, message });
                setTimeout(() => setToast({ show: false, message: "" }), 3000);
            };

            const calculateDailyKcal = () => {
                const { age, height, weight, gender, healthGoal, activityLevel } = userProfile;
                if (!age || !height || !weight) return;
                let bmr = gender === "Laki-laki"
                    ? (10 * Number(weight)) + (6.25 * Number(height)) - (5 * Number(age)) + 5
                    : (10 * Number(weight)) + (6.25 * Number(height)) - (5 * Number(age)) - 161;
                const activityMultiplier = {
                    sedentary: Number(aiConfig.activityMultiplierBase),
                    light: Number(aiConfig.activityMultiplierBase) + 0.15,
                    moderate: Number(aiConfig.activityMultiplierBase) + 0.3,
                    active: Number(aiConfig.activityMultiplierBase) + 0.5
                }[activityLevel] || 1.25;
                let tdee = Math.round(bmr * activityMultiplier);
                if (healthGoal === "lose_weight") tdee -= 350;
                else if (healthGoal === "gain_muscle") tdee += 300;
                else if (healthGoal === "detox") tdee -= 150;
                const configAdjust = (100 - Number(aiConfig.ageAdjustmentFactor)) / 100;
                tdee = Math.round(tdee * configAdjust);
                if (tdee < 1200) tdee = 1200;
                setUserProfile(prev => ({
                    ...prev,
                    dailyCalories: tdee,
                    protein: Math.round(Number(weight) * 1.3),
                    fiber: Math.round(tdee / 84)
                }));
            };

            useEffect(() => {
                calculateDailyKcal();
            }, [userProfile.weight, userProfile.height, userProfile.age, userProfile.activityLevel, userProfile.healthGoal, aiConfig.useMifflin, aiConfig.activityMultiplierBase, aiConfig.ageAdjustmentFactor]);

            return (
                <AppContext.Provider value={{ userProfile, setUserProfile, aiConfig, setAiConfig, cartCount, setCartCount, toast, triggerToast }}>
                    {children}
                </AppContext.Provider>
            );
        }

        // ✅ FIX: useNavigate → useHistory (react-router-dom v5)
        function SharedHeader({ title, showBack = false }) {
            const history = useHistory();
            return (
                <header className="sticky top-0 z-40 bg-white/95 border-b border-[#F4E1B9]/30 backdrop-blur-sm px-5 h-16 flex justify-between items-center w-full shrink-0">
                    <div className="flex items-center gap-3">
                        {showBack ? (
                            <button onClick={() => history.goBack()} className="p-2 rounded-full hover:bg-[#fff2dc] text-[#705c1b] flex items-center justify-center transition-all active:scale-95 border border-[#F4E1B9]/50" style={{ width: "36px", height: "36px" }}>

                            </button>
                        ) : (

                    </div>

                        <Link to="/notifications" className="w-8 h-8 flex items-center justify-center hover:bg-[#ffecc6] rounded-full text-[#705c1b]">
                            <span className="material-symbols-outlined text-[20px]">notifications</span>
                        </Link>

                            R-T

                    </div>

            );
        }

        function BottomNavigation() {
            const history = useHistory();
            const location = useLocation();
            const showOnPaths = ["/home", "/recommendations", "/insights", "/notifications", "/profile"];
            if (!showOnPaths.includes(location.pathname)) return null;
            const tabs = [
                { path: "/home", icon: "home", label: "Home" },
                { path: "/insights", icon: "insights", label: "Nutrisi" },
                { path: "/notifications", icon: "notifications", label: "Notif" },
                { path: "/profile", icon: "person", label: "Profil" }
            ];
            const isActive = (path) => location.pathname === path || (path === "/insights" && location.pathname === "/recommendations");
            return (
                <nav className="absolute bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 h-16 bg-white/95 backdrop-blur-sm border-t border-[#F4E1B9]/50 rounded-t-2xl shadow-[0_-4px_20px_rgba(107,91,46,0.06)] shrink-0">
                    {tabs.map((tab) => (
                        <button key={tab.path} onClick={() => history.push(tab.path)} className={`flex flex-col items-center justify-center w-14 h-full relative font-medium transition-all ${isActive(tab.path) ? 'scale-105' : 'hover:scale-[1.02]'}`}>
                            <span className="material-symbols-outlined text-[22px]" style={{ color: isActive(tab.path) ? "#576415" : "#7d7667", fontVariationSettings: isActive(tab.path) ? "'FILL' 1" : "'FILL' 0" }}>{tab.icon}</span>
                            <span className="text-[10px] tracking-tight mt-0.5" style={{ color: isActive(tab.path) ? "#576415" : "#7d7667" }}>{tab.label}</span>
                        </button>
                    ))}
                </nav>
            );
        }

        function AccordionItem({ icon, title, subtitle, isOpen, onToggle, children }) {

        }

        function SplashScreen() {

                        </div>
                        <h1 className="text-3xl font-black text-[#241a03] font-sans">Quero-T AI</h1>
                        <p className="text-sm text-[#4c4639] max-w-xs leading-relaxed">Aplikasi Premium Pengatur Nutrisi Roti Organik Sesuai Profil Metabolisme Tubuh Anda</p>
                    </div>
                    <div className="w-full pb-10">

        function LoginScreen() {

                        </div>
                        <div className="flex items-center gap-2 mb-6">
                            <button onClick={() => history.goBack()} className="p-2 rounded-full hover:bg-amber-50 text-[#705c1b]" style={{ width: "40px", height: "40px" }}><span className="material-symbols-outlined text-[24px]">arrow_back</span></button>

                        </div>

                                    ))}
                                </div>
                            </div>
                            <div className="space-y-1.5">
                                <label className="text-xs font-bold text-[#705c1b] uppercase">Usia (tahun)</label>
                                <input type="number" value={userProfile.age} onChange={(e) => setUserProfile(prev => ({ ...prev, age: Number(e.target.value) }))} className="w-full border border-[#F4E1B9] rounded-xl px-4 py-3 text-sm outline-none focus:ring-1 focus:ring-[#576415]" />

            const history = useHistory();
            return (

                        <div className="bg-[#f0ebff] border border-[#d6ccff] rounded-3xl p-5 space-y-3">

        function AdminConfigScreen() {

            const handleSave = () => triggerToast("💾 Konfigurasi AI berhasil dimutakhirkan!");
            const toggleAccordion = (key) => setActiveAccordion(prev => prev === key ? null : key);
            return (
                <div className="flex flex-col bg-[#FFF8F1] h-full overflow-y-auto no-scrollbar pb-20">
                    <SharedHeader title="⚙️ Konfigurasi Portal AI" showBack={true} />
                    <div className="p-5 space-y-6">
                        <p className="text-xs text-[#7d7667] leading-relaxed">Kelola matriks neural AI, formula target gizi, dan koefisien BMI agar menu kustom sesuai pola diet konsumen.</p>
                        <button onClick={handleSave} className="w-full bg-[#576415] text-white py-3.5 rounded-2xl font-bold text-xs shadow-lg flex items-center justify-center gap-2 active:scale-98 transition-transform">
                            <span className="material-symbols-outlined text-sm">save</span><span>Simpan Konfigurasi AI</span>
                        </button>
                        <div className="grid grid-cols-2 gap-3">
                            <div className="organic-card p-4 space-y-1">
                                <span className="text-[10px] text-gray-400 font-bold uppercase block">Penerimaan AI</span>
                                <span className="text-xl font-black text-[#576415]">{aiConfig.recommendationRate}%</span>
                                <div className="w-full h-1 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-[#576415]" style={{width:`${aiConfig.recommendationRate}%`}}></div></div>
                            </div>
                            <div className="organic-card p-4 space-y-1">
                                <span className="text-[10px] text-gray-400 font-bold uppercase block">Pre-Akurasi</span>
                                <span className="text-xl font-black text-[#576415]">{aiConfig.predictionAccuracy}%</span>
                                <div className="w-full h-1 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-[#576415]" style={{width:`${aiConfig.predictionAccuracy}%`}}></div></div>
                            </div>
                        </div>
                        <div className="organic-card p-5 space-y-4">
                            <h3 className="text-xs font-black text-[#241a03] uppercase tracking-wider">Parameter Neural Global</h3>
                            <div className="flex items-center justify-between">
                                <div>
                                    <label className="text-[13px] font-extrabold text-[#241a03] block">Mifflin-St Jeor Formula</label>
                                    <p className="text-[10px] text-gray-400">Aktifkan kalkulasi dwi-gender</p>
                                </div>
                                <button onClick={() => { setAiConfig(prev => ({ ...prev, useMifflin: !prev.useMifflin })); triggerToast(`Mifflin formula ${!aiConfig.useMifflin ? 'DIAKTIFKAN' : 'DINONAKTIFKAN'}`); }} className={`w-12 h-6 rounded-full p-0.5 transition-colors duration-200 relative ${aiConfig.useMifflin ? 'bg-[#576415]' : 'bg-gray-300'}`}>
                                    <div className={`w-5 h-5 bg-white rounded-full transition-transform shadow-md ${aiConfig.useMifflin ? 'translate-x-[24px]' : 'translate-x-0'}`}></div>
                                </button>
                            </div>
                            <div className="space-y-2 pt-1">
                                <div className="flex justify-between items-center text-xs">
                                    <label className="text-[12px] font-extrabold text-[#241a03]">Activity Multiplier Base</label>
                                    <span className="font-black text-[#576415]">{aiConfig.activityMultiplierBase}</span>
                                </div>
                                <input type="range" min="1" max="2" step="0.05" value={aiConfig.activityMultiplierBase} onChange={(e) => setAiConfig(prev => ({ ...prev, activityMultiplierBase: Number(e.target.value) }))} className="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-[#576415]" />
                            </div>
                        </div>
                        <div className="space-y-3.5">
                            <AccordionItem icon="monitor_weight" title="1. BMI-Based Mapping" subtitle="Rekomendasi produk berdasarkan massa tubuh" isOpen={activeAccordion === "bmi"} onToggle={() => toggleAccordion("bmi")}>
                                <div className="space-y-3">
                                    {[['Underweight','blue-500','bmiUnderweightMapping'],['Normal','[#576415]','bmiNormalMapping'],['Overweight','yellow-500','bmiOverweightMapping']].map(([label, color, key]) => (
                                        <div key={key} className="flex items-center justify-between p-3 bg-[#FFFBF7] rounded-xl border">
                                            <span className={`text-xs font-bold text-${color} uppercase`}>{label}</span>
                                            <select value={aiConfig[key]} onChange={(e) => { setAiConfig(prev => ({ ...prev, [key]: e.target.value })); triggerToast(`Map BMI ${label} → ${e.target.value}`); }} className="border text-xs rounded-lg p-1">
                                                <option value="Protein+">Protein+</option>
                                                <option value="Active">Active</option>
                                                <option value="Lean-Core">Lean-Core</option>
                                            </select>
                                        </div>
                                    ))}
                                </div>
                            </AccordionItem>
                            <AccordionItem icon="fitness_center" title="2. Activity Level Mapping" subtitle="Logika berdasarkan intensitas olahraga" isOpen={activeAccordion === "activity"} onToggle={() => toggleAccordion("activity")}>
                                <div className="space-y-3 text-xs text-[#4c4639]">
                                    {[['🚴 Sedentary','Low Carb Bakery'],['🏃 Moderat','Balanced Bowl'],['🏋️ Tinggi','Endurance Fuel']].map(([act,rec]) => (
                                        <div key={act} className="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border">
                                            <span>{act}</span><span>➔</span><span className="font-extrabold text-[#576415]">{rec}</span>
                                        </div>
                                    ))}
                                </div>
                            </AccordionItem>
                            <AccordionItem icon="schedule" title="3. Time-of-Day Rules" subtitle="Rekomendasi otomatis berdasarkan jam" isOpen={activeAccordion === "time"} onToggle={() => toggleAccordion("time")}>
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center p-3.5 bg-[#FFFBF7] rounded-xl border">
                                        <div><p className="text-xs font-bold text-[#241a03]">🌞 Pagi (06:00-10:00)</p><p className="text-[10px] text-gray-400">Oatmeal booster.</p></div>
                                        <span className="material-symbols-outlined text-[#F3A72A]">wb_sunny</span>
                                    </div>
                                    <div className="flex justify-between items-center p-3.5 bg-[#FFFBF7] rounded-xl border">
                                        <div><p className="text-xs font-bold text-[#241a03]">🌙 Malam (21:00+)</p><p className="text-[10px] text-gray-400">Light fiber salad.</p></div>
                                        <span className="material-symbols-outlined text-[#7B5EA7]">bedtime</span>
                                    </div>
                                </div>
                            </AccordionItem>
                        </div>
                    </div>
                    <BottomNavigation />
                </div>
            );
        }

        function ProfileScreen() {
            const { userProfile, setUserProfile, triggerToast } = useContext(AppContext);
            const history = useHistory();
            const [editBody, setEditBody] = useState(false);
            const bmi = (userProfile.weight / Math.pow(userProfile.height / 100, 2)).toFixed(1);
            return (
                <div className="flex flex-col bg-[#FFF8F1] h-full overflow-y-auto no-scrollbar pb-20">
                    <SharedHeader title="👤 Profil Pengguna" showBack={true} />
                    <div className="p-5 space-y-5">
                        <div className="w-full bg-gradient-to-br from-[#D7BD72] to-[#C4A85A] rounded-3xl p-6 flex flex-col items-center text-white shadow relative overflow-hidden">
                            <div className="w-16 h-16 rounded-full bg-[#576415] flex items-center justify-center border-4 border-white shadow">
                                <span className="text-white text-2xl font-black">{userProfile.name[0]}</span>
                            </div>
                            <h2 className="mt-3 text-lg font-black font-sans text-white">{userProfile.name}</h2>
                            <p className="text-[10px] uppercase font-bold tracking-wider opacity-80 mt-0.5 text-white">Premium Member 2026</p>
                            <div className="flex w-full mt-5 pt-5 border-t border-white/20 items-center justify-between text-center text-xs">
                                <div className="flex-1"><p className="font-black text-lg text-white">12</p><p className="text-[9px] opacity-75 uppercase text-white">Pesanan</p></div>
                                <div className="w-[1px] h-6 bg-white/20"></div>
                                <div className="flex-1"><p className="font-black text-lg text-white">{userProfile.dailyCalories}</p><p className="text-[9px] opacity-75 uppercase text-white">Target kcal</p></div>
                                <div className="w-[1px] h-6 bg-white/20"></div>
                                <div className="flex-1"><p className="font-black text-lg text-white">{userProfile.streak} 🔥</p><p className="text-[9px] opacity-75 uppercase text-white">Streak</p></div>
                            </div>
                        </div>
                        <div className="organic-card p-5 space-y-4">
                            <div className="flex justify-between items-center">
                                <h3 className="text-sm font-black text-[#241a03]">Data Tubuh & Metrik</h3>
                                <button onClick={() => setEditBody(!editBody)} className="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 text-[#F3A72A] bg-[#FFF2DC]">
                                    <span className="material-symbols-outlined text-base">{editBody ? "close" : "edit"}</span>
                                </button>
                            </div>
                            {editBody ? (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-3 text-xs">
                                        {[['Umur (tahun)','age','number'],['Tinggi (cm)','height','number'],['Berat (kg)','weight','number']].map(([label, field, type]) => (
                                            <div key={field} className="space-y-1">
                                                <label className="font-extrabold text-[#705c1b]">{label}</label>
                                                <input type={type} value={userProfile[field]} onChange={(e) => setUserProfile(prev => ({ ...prev, [field]: Number(e.target.value) }))} className="w-full border rounded-xl p-2.5 text-xs" />
                                            </div>
                                        ))}
                                    </div>
                                    <button onClick={() => { setEditBody(false); triggerToast("💪 Metrik tubuh diperbarui! Kalori dihitung ulang."); }} className="w-full bg-[#576415] text-white text-xs font-bold py-3 rounded-xl active:scale-95">Simpan & Update AI</button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 gap-2 text-xs">
                                    <div className="p-3 bg-[#fff2dc] rounded-xl"><p className="text-[10px] text-gray-400">Usia</p><p className="font-bold text-[#241a03]">{userProfile.age} tahun</p></div>
                                    <div className="p-3 bg-[#fff2dc] rounded-xl"><p className="text-[10px] text-gray-400">Tinggi / Berat</p><p className="font-bold text-[#241a03]">{userProfile.height}cm / {userProfile.weight}kg</p></div>
                                    <div className="p-3 bg-[#fff2dc] rounded-xl col-span-2"><p className="text-[10px] text-gray-400">BMI</p><p className="font-bold text-[#576415]">{bmi} — {bmi < 18.5 ? "Underweight" : bmi < 25 ? "Normal" : "Overweight"}</p></div>
                                </div>
                            )}
                        </div>
                        <button onClick={() => history.push('/admin')} className="w-full py-4 bg-[#576415]/10 border border-[#576415]/20 text-[#576415] font-extrabold text-xs rounded-2xl active:scale-95 transition-all text-center">⚙️ Buka Panel Konfigurasi AI</button>
                        <button onClick={() => { setUserProfile(prev => ({ ...prev, name: "Raditya", age: 22, weight: 65, height: 170 })); triggerToast("Sesi direset."); history.push('/'); }} className="w-full py-4 border-2 border-red-500/20 hover:bg-red-500/5 text-red-500 font-extrabold text-xs rounded-2xl active:scale-95 transition-all text-center">Keluar dari Akun (Reset state)</button>
                    </div>
                    <BottomNavigation />
                </div>
            );
        }

        function NotificationsScreen() {
            const { triggerToast, setUserProfile } = useContext(AppContext);
            const [notifications, setNotifications] = useState([
                { id: 1, type: "HEALTH", time: "Baru Saja", title: "Health Alert", text: "Asupan serat harian di bawah target. AI merekomendasikan booster chia seeds pagi ini!", isRead: false },
                { id: 2, type: "ACHIEVEMENT", time: "2 Jam Lalu", title: "Achievement Unlocked 🏆", text: "Kamu berhasil mencetak rekor 7 hari konsumsi tertib! Tingkat stamina meningkat 15%.", isRead: false },
                { id: 3, type: "LOGISTICS", time: "Logistik", title: "Restock Alert 📦", text: "Stok Quero-T Active tinggal 3 buah. Pesan paket langganan sekarang!", isRead: false },
                { id: 4, type: "AI_UPDATE", time: "3 Hari Lalu", title: "AI Model Diperbarui ✨", text: "Model AI diperbarui berdasarkan 847 data konsumsi. Akurasi naik dari 72% → 78%.", isRead: true },
            ]);
            const markAsRead = (id) => { setNotifications(prev => prev.map(n => n.id === id ? { ...n, isRead: true } : n)); triggerToast("Notifikasi ditandai dibaca."); };
            const triggerAction = (type) => {
                if (type === "HEALTH") { setUserProfile(prev => ({ ...prev, streak: prev.streak + 1 })); triggerToast("Booster Serat ditambahkan! Streak +1 ✨"); }
                else if (type === "ACHIEVEMENT") triggerToast("Voucher Diskon diklaim! 🎁");
                else triggerToast("Menuju halaman pemesanan.");
            };
            const typeColors = { HEALTH: "bg-amber-100 text-red-600", ACHIEVEMENT: "bg-[#576415]/10 text-[#576415]", LOGISTICS: "bg-blue-50 text-blue-600", AI_UPDATE: "bg-purple-50 text-purple-600" };
            return (
                <div className="flex flex-col bg-[#FFF8F1] h-full overflow-y-auto no-scrollbar pb-20">
                    <SharedHeader title="🔔 Pusat Notifikasi AI" showBack={true} />
                    <div className="p-5 space-y-6">
                        <div className="relative pl-4 space-y-8">
                            <div className="absolute left-1.5 top-2 bottom-2 w-0.5 bg-gradient-to-b from-[#576415]/40 to-transparent"></div>
                            {notifications.map(notif => (
                                <div key={notif.id} className="relative space-y-2">
                                    <span className={`absolute -left-6 top-1 h-3.5 w-3.5 rounded-full border-2 border-white shadow-sm ring-4 ring-[#FFF8F1] ${notif.isRead ? 'bg-gray-400' : 'bg-[#576415]'}`}></span>
                                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-[#576415]/10 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="text-[10px] text-gray-400 font-bold uppercase">{notif.time}</span>
                                            <span className={`text-[9px] font-black px-2 py-0.5 rounded-full ${typeColors[notif.type] || 'bg-gray-100 text-gray-600'}`}>{notif.type}</span>
                                        </div>
                                        <div>
                                            <h4 className="text-xs font-bold text-[#241a03]">{notif.title}</h4>
                                            <p className="text-[11px] text-[#4c4639] leading-relaxed mt-1">{notif.text}</p>
                                        </div>
                                        <div className="flex gap-2 pt-1">
                                            <button onClick={() => triggerAction(notif.type)} className="bg-[#576415]/10 hover:bg-[#576415]/15 text-[#576415] font-bold text-[10px] px-3 py-1.5 rounded-lg active:scale-95 transition-all">
                                                {notif.type === 'HEALTH' ? 'Konsumsi Solusi' : notif.type === 'ACHIEVEMENT' ? 'Klaim Hadiah 🎁' : 'Lihat Detail'}
                                            </button>
                                            {!notif.isRead && <button onClick={() => markAsRead(notif.id)} className="text-gray-400 font-medium text-[10px] px-2 py-1 hover:text-gray-600">Tandai dibaca</button>}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <BottomNavigation />
                </div>
            );
        }

        function App() {
            const { toast } = useContext(AppContext);
            return (
                <div className="w-full h-full relative">
                    <Switch>
                        <Route exact path="/" component={SplashScreen} />
                        <Route path="/splash" component={SplashScreen} />
                        <Route path="/login" component={LoginScreen} />
                        <Route path="/onboarding/1" component={OnboardingStep1} />
                        <Route path="/onboarding/2" component={OnboardingStep2} />
                        <Route path="/onboarding/3" component={OnboardingStep3} />
                        <Route path="/onboarding/4" component={OnboardingStep4} />
                        <Route path="/onboarding/5" component={RestrictionsScreen} />
                        <Route path="/ai-processing" component={AiProcessingScreen} />
                        <Route path="/onboarding-result" component={OnboardingResultScreen} />
                        <Route path="/home" component={HomeScreen} />
                        <Route path="/recommendations" component={RecommendationsScreen} />
                        <Route path="/insights" component={InsightsScreen} />
                        <Route path="/admin" component={AdminConfigScreen} />
                        <Route path="/profile" component={ProfileScreen} />
                        <Route path="/notifications" component={NotificationsScreen} />
                    </Switch>
                    {toast.show && (
                        <div className="absolute top-20 left-6 right-6 z-50 bg-[#241a03] text-white text-[12px] p-3.5 rounded-2xl flex items-center gap-3.5 shadow-xl border border-[#576415]/20 opacity-95">
                            <span className="material-symbols-outlined text-[20px] text-[#F3A72A]">info</span>
                            <span className="flex-1">{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(
            <AppProvider>
                <HashRouter>
                    <App />
                </HashRouter>
            </AppProvider>
        );
    </script>
</body>
</html>
